[project]
name = "pkm-canon"
version = "0.1.0"
description = "Source-faithful PKM capture and reviewed methodology packages"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30"
]

[project.scripts]
pkmcanon = "pkmcanon.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-jsonschema>=1.0",
  "ruff>=0.13",
  "httpx>=0.27"
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkmcanon"]
